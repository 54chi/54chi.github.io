<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>54chi</title>
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="preload" href="assets/fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/crt.css">
  <script>
    /*
     * Posts used to live at post.html?slug=… — those links are still out there,
     * so forward them into the deck rather than maintaining a second renderer.
     * replace() keeps the dead URL out of the back button.
     */
    (function () {
      var slug = new URLSearchParams(window.location.search).get('slug');
      window.location.replace(slug ? 'index.html#' + encodeURIComponent(slug) : 'index.html');
    })();
  </script>
</head>
<body class="page fx-on">
  <div class="crt">
    <div class="crt__frame">
      <div class="crt__screen">
        <div class="screen__scroll">
          <div class="sheet">
            <p class="notice">
              REDIRECTING<span class="cursor"></span><br><br>
              <a href="index.html">continue to 54chi</a>
            </p>
          </div>
        </div>
        <div class="crt__overlay" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</body>
</html>
