name: Index posts

# posts.json is generated from the posts' front matter, not hand-maintained.
# A pull request merged into master arrives here as a push to master, so this
# one trigger covers merges and direct edits on github.com alike.
on:
  push:
    branches: [master]
    # posts.json is deliberately absent from this list: the commit this
    # workflow pushes back only touches that file, so it cannot retrigger.
    paths:
      - 'posts/**'
      - 'tools/index_posts.py'
      - '.github/workflows/index-posts.yml'
  pull_request:
    paths:
      - 'posts/**'
      - 'tools/index_posts.py'
  workflow_dispatch:

concurrency:
  group: index-posts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # On a PR, only report. Committing to a contributor's branch is rude and the
  # push job will regenerate on merge anyway.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # index_posts.py reads the commit that added each post to fill in a
          # missing time. A shallow clone has no such commit and the script
          # would quietly fall back to 12:00 for everything.
          fetch-depth: 0
      - name: Check posts.json is current
        run: python3 tools/index_posts.py --check

  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate posts.json
        run: python3 tools/index_posts.py

      # master has a ruleset requiring verified signatures, so a plain
      # `git commit && git push` from the runner is rejected (GH013) -- the
      # bot has no signing key. Commits created through the REST API are
      # signed by GitHub automatically, which satisfies the rule without
      # putting a private key in repo secrets. posts.json is the only file
      # this job writes, so the single-file Contents API is a clean fit.
      - name: Commit if changed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'posts.json';
            const branch = context.ref.replace('refs/heads/', '');
            const { owner, repo } = context.repo;
            const content = fs.readFileSync(path);

            let sha;
            try {
              const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (Buffer.from(data.content, 'base64').equals(content)) {
                core.info('posts.json already current, nothing to commit');
                return;
              }
              sha = data.sha;
            } catch (err) {
              if (err.status !== 404) throw err;   // 404 = first ever write
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch, sha,
              message: 'Regenerate posts.json from front matter',
              content: content.toString('base64'),
            });
            core.info('committed posts.json');
